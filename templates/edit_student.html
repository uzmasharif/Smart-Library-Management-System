
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student | KIU Library</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Edit Student Information</h1>

    <form action="{{ url_for('edit_student', student_id=student.id) }}"
          method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Student Name</label>
        <input type="text" name="name"
               value="{{ student.name }}" required>

        <label>Roll Number</label>
        <input type="text" name="roll_no"
               value="{{ student.roll_no }}" required>

        <label>Department</label>
        <input type="text" name="department"
               value="{{ student.department }}" required>

        <label>Semester</label>
        <input type="number" name="semester"
               value="{{ student.semester }}" min="1" required>

        <label>Email</label>
        <input type="email" name="email"
               value="{{ student.email or '' }}">

        <button type="submit">Update Student</button>

    </form>

    <br>

    <a href="{{ url_for('students') }}">Back to Students</a>

</body>
</html>
